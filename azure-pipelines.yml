# =============================================================================
# Azure Pipelines (YAML) - API Aurora Pet / Clyvo (Spring Boot, Java 21)
# Adaptado do Semana_19_02_Playmix-yaml.txt (Prof. João Menk)
#
# CI: compila com Maven, roda os testes e publica o JAR como artefato
# CD: grava as variáveis do banco no Web App e faz o deploy do JAR
#
# ORIGEM DO CÓDIGO: GitHub  ->  https://github.com/MCGI-PW/API-Clyvo-M_Vet
#   Este arquivo fica na RAIZ do repositório da API com o nome azure-pipelines.yml.
#   Criar a pipeline: Pipelines > New pipeline > GitHub (YAML) > MCGI-PW/API-Clyvo-M_Vet
#     > "Existing Azure Pipelines YAML file" > branch main > /azure-pipelines.yml
#   (o app "Azure Pipelines" precisa estar instalado na organização MCGI-PW do GitHub)
#
# Pré-requisitos (slides 86 a 88 e 94):
#   - Service Connection "MyAzConnection" com escopo no grupo de recursos
#     da API: rg-aurora-sprint4 (é onde estão o Web App e o banco)
#   - Variáveis da pipeline (botão "Variables"), ver slide 94:
#       SPRING_DATASOURCE_URL       jdbc:sqlserver://sql-server-aurora-565708-brazilsouth.database.windows.net:1433;database=db-aurora;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
#       SPRING_DATASOURCE_USERNAME  user-aurora
#       SPRING_DATASOURCE_PASSWORD  senha do banco  (marque "Keep this value secret")
# =============================================================================

# Push na main do GitHub = CI + CD (deploy)
trigger:
  branches:
    include:
      - main            # >>> ALTERADO: a branch do repositório da API é "main" (minúsculo)

# >>> NOVO (GitHub): Pull Request para a main roda só o CI (build + testes) e
#     mostra o resultado como "check" no PR. O CD não roda em PR (ver condição do stage CD).
pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  JAVA_VERSION: '21'                      # >>> ALTERADO: o pom.xml da API usa Java 21
  WEB_APP_NAME: 'api-aurora-rm565708'     # >>> ALTERADO: Web App criado pelo criar-webapp-api.sh
  ARTIFACT_NAME: 'app'
  # >>> NOVO: perfil "azure" = SQL Server do Azure (driver, dialeto e migrations T-SQL)
  #           + "demo" = contas de demonstração para a apresentação
  # Nome SEM o prefixo SPRING_: variável não secreta vira variável de ambiente nos testes
  # do Maven, e SPRING_PROFILES é lido pelo Spring como 'spring.profiles' (proibido no Boot 3).
  PERFIS_SPRING: 'azure,demo'

stages:
  - stage: CI
    displayName: 'CI - Build e Testes'
    jobs:
      - job: Build
        displayName: 'Compilar Java Spring Boot'
        steps:
          # >>> NOVO: baixa o código do repositório GitHub da API (o "self" da pipeline)
          - checkout: self
            displayName: 'Checkout do GitHub (MCGI-PW/API-Clyvo-M_Vet)'
            fetchDepth: 1

          - task: JavaToolInstaller@0
            displayName: 'Configurar Java 21'
            inputs:
              versionSpec: '$(JAVA_VERSION)'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: Maven@4
            displayName: 'Maven - Compilar e executar testes'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'clean package'
              options: '-B'
              mavenOptions: '-Xmx3072m'          # memória do Maven (mantido da versão do grupo)
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              testRunTitle: 'Testes de Código'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.21'            # >>> ALTERADO: JDK 21 (era 1.17)
              mavenVersionOption: 'Default'

          - task: CopyFiles@2
            displayName: 'Preparar artefato JAR'
            inputs:
              SourceFolder: '$(System.DefaultWorkingDirectory)'
              Contents: '**/target/*.jar'
              TargetFolder: '$(Build.ArtifactStagingDirectory)/$(ARTIFACT_NAME)'

          - task: PublishPipelineArtifact@1
            displayName: 'Publicar artefato app'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/$(ARTIFACT_NAME)'
              artifact: '$(ARTIFACT_NAME)'
              publishLocation: 'pipeline'

  - stage: CD
    displayName: 'CD - Deploy no Azure Web App'
    dependsOn: CI
    # >>> ALTERADO: só faz deploy em push na main (nunca em Pull Request)
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: Deploy
        displayName: 'Deploy Spring Boot'
        environment: 'api-aurora-rm565708'       # >>> ALTERADO: nome do ambiente = nome do Web App
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'app'

                - task: AzureAppServiceSettings@1
                  displayName: 'Configurar variáveis de ambiente do Web App'
                  inputs:
                    azureSubscription: 'MyAzConnection'
                    appName: '$(WEB_APP_NAME)'
                    # As outras variáveis do Web App (JWT_SECRET, DEMO_PASSWORD, PORT...)
                    # gravadas pelo criar-webapp-api.sh são mantidas: esta tarefa só
                    # cria/atualiza as listadas abaixo.
                    appSettings: |
                      [
                        {
                          "name": "SPRING_DATASOURCE_USERNAME",
                          "value": "$(SPRING_DATASOURCE_USERNAME)",
                          "slotSetting": false
                        },
                        {
                          "name": "SPRING_DATASOURCE_PASSWORD",
                          "value": "$(SPRING_DATASOURCE_PASSWORD)",
                          "slotSetting": false
                        },
                        {
                          "name": "SPRING_DATASOURCE_URL",
                          "value": "$(SPRING_DATASOURCE_URL)",
                          "slotSetting": false
                        },
                        {
                          "name": "SPRING_PROFILES_ACTIVE",
                          "value": "$(PERFIS_SPRING)",
                          "slotSetting": false
                        }
                      ]

                - task: AzureWebApp@1
                  displayName: 'Deploy via Zip Deploy'
                  inputs:
                    azureSubscription: 'MyAzConnection'
                    appType: 'webAppLinux'
                    appName: '$(WEB_APP_NAME)'
                    package: '$(Pipeline.Workspace)/app/**/*.jar'
                    deploymentMethod: 'zipDeploy'
