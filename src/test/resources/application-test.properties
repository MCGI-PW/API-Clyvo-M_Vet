# Propriedades de teste — utiliza H2 em memoria
spring.datasource.url=jdbc:h2:mem:clyvovet_test;DB_CLOSE_DELAY=-1;MODE=Oracle
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

jwt.secret=test-secret-key-for-unit-tests-only-must-be-256-bits-long-for-hs256
jwt.expiration.ms=3600000

# Desabilitar OAuth2 nos testes
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

orchestrator.base-url=http://localhost:9999
orchestrator.api-key=test-api-key
