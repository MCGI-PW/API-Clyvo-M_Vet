# Propriedades de teste — utiliza H2 em memoria
spring.datasource.url=jdbc:h2:mem:clyvovet_test;DB_CLOSE_DELAY=-1;MODE=Oracle
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Schema criado pelas mesmas migrations Flyway (V1..V6) usadas no Oracle, para os testes
# de integração exercitarem os tipos reais das colunas (ex.: NUMBER(1) para booleanos)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=test-secret-key-for-unit-tests-only-must-be-256-bits-long-for-hs256
jwt.expiration.ms=3600000

# ==========================================
# OAUTH2 CLIENT TEST CONFIGURATION
# ==========================================
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=test-github-client-id
spring.security.oauth2.client.registration.github.client-secret=test-github-client-secret
spring.security.oauth2.client.registration.github.scope=read:user,user:email

