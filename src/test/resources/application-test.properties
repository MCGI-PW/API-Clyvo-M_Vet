# Propriedades de teste — sobrescreve application.properties em ambiente de testes
# Usa H2 em memória para evitar dependência de PostgreSQL nos testes unitários

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Desabilitar Flyway nos testes (schema criado pelo Hibernate)
spring.flyway.enabled=false

jwt.secret=test-secret-key-for-unit-tests-only-must-be-256-bits-long-for-hs256
jwt.expiration.ms=3600000

# Desabilitar OAuth2 nos testes
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

orchestrator.base-url=http://localhost:9999
orchestrator.api-key=test-api-key
