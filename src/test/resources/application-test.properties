# Propriedades de teste — utiliza PostgreSQL local com persistencia real
spring.datasource.url=jdbc:postgresql://localhost:5432/clyvovet
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true

jwt.secret=test-secret-key-for-unit-tests-only-must-be-256-bits-long-for-hs256
jwt.expiration.ms=3600000

# Desabilitar OAuth2 nos testes
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

orchestrator.base-url=http://localhost:9999
orchestrator.api-key=test-api-key
