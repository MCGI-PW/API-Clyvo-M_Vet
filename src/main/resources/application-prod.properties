# ==========================================
# PRODUCTION PROFILE (AZURE + ORACLE FIAP)
# Todas as credenciais são injetadas por variáveis de ambiente
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
# Garante que V1..V6 rodem mesmo se o schema já tiver outros objetos do RM
spring.flyway.baseline-version=0
spring.thymeleaf.cache=true

jwt.secret=${JWT_SECRET}
app.demo.password=${DEMO_PASSWORD:}
app.oauth2.mock-enabled=false

server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.h2.console.enabled=false
