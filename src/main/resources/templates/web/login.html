<!DOCTYPE html>
<html th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('login.pageTitle')}"></head>
<body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="page page--auth">
        <div th:replace="~{fragments/layout :: alerts}"></div>
        <div class="auth-single">
            <section class="card">
                <h2 class="auth-title" th:text="#{login.title}">Acessar Plataforma</h2>
                <p class="auth-subtitle" th:text="#{login.subtitle}">Entre com suas credenciais para continuar.</p>

                <form th:action="@{/web/login}" th:object="${loginRequest}" method="post">
                    <div class="form-group">
                        <label class="form-label" for="loginEmail" th:text="#{login.email}">E-mail</label>
                        <input type="email" id="loginEmail" class="form-input" th:field="*{email}" autocomplete="email" th:placeholder="#{login.email.placeholder}" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="loginPassword" th:text="#{login.password}">Senha</label>
                        <input type="password" id="loginPassword" class="form-input" th:field="*{password}" autocomplete="current-password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-aurora btn-block" th:text="#{login.btn}">Entrar</button>
                </form>

                <a th:href="@{/web/register}" class="btn-outline btn-block" th:text="#{login.register.cta}">Criar conta</a>

                <div th:if="${oauthGoogleEnabled or oauthGithubEnabled or oauthMockEnabled}" class="divider">
                    <span th:text="#{login.oauth.divider}">Ou acesse com</span>
                </div>

                <div th:if="${oauthGoogleEnabled or oauthGithubEnabled}" class="oauth-buttons">
                    <a th:if="${oauthGoogleEnabled}" th:href="@{/oauth2/authorization/google}" class="oauth-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                        </svg>
                        <span th:text="#{login.oauth.google}">Entrar com Google</span>
                    </a>

                    <a th:if="${oauthGithubEnabled}" th:href="@{/oauth2/authorization/github}" class="oauth-btn oauth-btn--github">
                        <svg width="18" height="18" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                        </svg>
                        <span th:text="#{login.oauth.github}">Entrar com GitHub</span>
                    </a>
                </div>

                <!-- Simulação OAuth2 apenas no perfil local -->
                <div th:if="${oauthMockEnabled}" class="demo-box">
                    <strong th:text="#{login.oauth.mock}">Demonstração local (simulação OAuth2):</strong>
                    <div class="demo-links">
                        <a th:href="@{/web/login/oauth2-mock(provider='google')}" class="status-badge" th:text="#{login.oauth.mock.google}">Testar Google</a>
                        <a th:href="@{/web/login/oauth2-mock(provider='github')}" class="status-badge" th:text="#{login.oauth.mock.github}">Testar GitHub</a>
                    </div>
                </div>

                <p class="api-note">
                    <span th:text="#{login.api.note}">Documentação da API REST disponível via</span>
                    <a th:href="@{/swagger-ui.html}">Swagger UI</a>.
                </p>
            </section>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
