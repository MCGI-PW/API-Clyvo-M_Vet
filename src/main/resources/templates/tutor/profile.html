<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Perfil do Tutor - ClyvoVet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 260px; background: #0f1b2d; color: #fff; padding: 2rem 1rem; }
        .main-content { flex: 1; padding: 2rem; overflow-y: auto; }
        
        .header { margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;}
        .header h1 { margin: 0; color: #1e293b; font-size: 1.75rem; }
        
        .profile-container { display: flex; gap: 2rem; max-width: 1000px; margin: 0 auto; }
        
        .profile-card { background: white; border-radius: 1rem; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); flex: 1; text-align: center; }
        .avatar { width: 120px; height: 120px; border-radius: 50%; background: #e2e8f0; margin: 0 auto 1.5rem auto; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #94a3b8; }
        .name { font-size: 1.5rem; font-weight: 700; color: #0f1b2d; margin-bottom: 0.5rem; }
        .email { color: #64748b; margin-bottom: 1.5rem; }
        
        .info-card { background: white; border-radius: 1rem; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); flex: 2; }
        .info-card h2 { margin: 0 0 1.5rem 0; font-size: 1.25rem; color: #1e293b; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.75rem;}
        
        .info-group { margin-bottom: 1.25rem; }
        .info-group label { display: block; font-size: 0.875rem; font-weight: 600; color: #64748b; margin-bottom: 0.25rem; }
        .info-group .value { font-size: 1rem; color: #1e293b; }
        
        .btn { padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; border: none; text-decoration: none; display: inline-block; text-align: center;}
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        
        .sidebar-brand { font-size: 1.5rem; font-weight: bold; margin-bottom: 2rem; display: block; text-decoration: none; color: white; text-align: center; }
        .nav-link { display: block; color: #cbd5e1; text-decoration: none; padding: 0.75rem 1rem; border-radius: 0.5rem; margin-bottom: 0.5rem; }
        .nav-link:hover { background: #1e293b; color: white; }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="/" class="sidebar-brand">ClyvoVet</a>
        <a href="/tutor/dashboard" class="nav-link">Dashboard</a>
        <a href="/tutor/pets" class="nav-link">Meus Pets</a>
        <a href="/tutor/appointments" class="nav-link">Minhas Consultas</a>
        <a href="/tutor/profile" class="nav-link" style="background: #1e293b; color: white;">Meu Perfil</a>
    </div>
    
    <div class="main-content">
        <div class="header">
            <h1>Meu Perfil</h1>
            <a href="/tutor/profile/edit" class="btn btn-primary">Editar Perfil</a>
        </div>
        
        <div class="profile-container">
            <div class="profile-card">
                <div class="avatar" th:if="${tutor.profilePictureUrl == null}">T</div>
                <img th:if="${tutor.profilePictureUrl != null}" th:src="${tutor.profilePictureUrl}" class="avatar" style="object-fit: cover;">
                <div class="name" th:text="${user.name}">Nome do Tutor</div>
                <div class="email" th:text="${user.email}">email@exemplo.com</div>
            </div>
            
            <div class="info-card">
                <h2>Informações Pessoais</h2>
                <div class="info-group">
                    <label>Telefone</label>
                    <div class="value" th:text="${tutor.phone != null ? tutor.phone : 'Não informado'}">(11) 99999-9999</div>
                </div>
                <div class="info-group">
                    <label>CPF / Documento</label>
                    <div class="value" th:text="${tutor.document != null ? tutor.document : 'Não informado'}">***.***.***-**</div>
                </div>
                <div class="info-group">
                    <label>Endereço</label>
                    <div class="value" th:text="${tutor.address != null ? tutor.address : 'Não informado'}">Rua Exemplo, 123</div>
                </div>
                <div class="info-group">
                    <label>Membro desde</label>
                    <div class="value" th:text="${#temporals.format(tutor.createdAt, 'dd/MM/yyyy')}">01/01/2023</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
