<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro — ClyvoVet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f1b2d 0%, #1e293b 60%, #0f172a 100%);
    }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(24px);
      border-radius: 20px;
      padding: 48px 44px;
      width: 100%;
      max-width: 480px;
      animation: fadeUp 0.4s ease-out;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border-radius: 14px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 24px; margin-bottom: 12px;
    }
    .brand-name { font-size: 24px; font-weight: 800; color: #f1f5f9; letter-spacing: -0.5px; }
    .brand-sub { font-size: 13px; color: #64748b; margin-top: 4px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    input, select {
      width: 100%; padding: 12px 14px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; color: #f1f5f9;
      font-size: 14px; font-family: inherit;
      outline: none; transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
    input.error, select.error { border-color: #ef4444; }
    .error-msg { font-size: 12px; color: #f87171; margin-top: 4px; }
    select option { background: #1e293b; color: #f1f5f9; }
    .btn-submit {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 600; font-family: inherit;
      cursor: pointer; margin-top: 8px; transition: all 0.2s;
    }
    .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,99,235,0.35); }
    .divider { text-align: center; color: #475569; font-size: 13px; margin: 20px 0; }
    .link-secondary { display: block; text-align: center; color: #60a5fa; font-size: 13px; text-decoration: none; margin-top: 20px; }
    .link-secondary:hover { text-decoration: underline; }
    .alert-error {
      background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3);
      color: #f87171; border-radius: 10px; padding: 12px 14px;
      font-size: 13px; margin-bottom: 20px;
    }
    .alert-success {
      background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3);
      color: #34d399; border-radius: 10px; padding: 12px 14px;
      font-size: 13px; margin-bottom: 20px;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-icon">🐾</div>
    <div class="brand-name">ClyvoVet</div>
    <div class="brand-sub">Crie sua conta</div>
  </div>

  <div th:if="${param.error}" class="alert-error">
    ⚠️ Erro ao realizar cadastro. Verifique os campos.
  </div>

  <form th:action="@{/register}" th:object="${registerRequest}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <div class="form-group">
      <label for="name">Nome completo</label>
      <input id="name" type="text" th:field="*{name}"
             th:classappend="${#fields.hasErrors('name')} ? 'error'" placeholder="Seu nome"/>
      <div th:if="${#fields.hasErrors('name')}" class="error-msg" th:errors="*{name}"></div>
    </div>

    <div class="form-group">
      <label for="email">E-mail</label>
      <input id="email" type="email" th:field="*{email}"
             th:classappend="${#fields.hasErrors('email')} ? 'error'" placeholder="seu@email.com"/>
      <div th:if="${#fields.hasErrors('email')}" class="error-msg" th:errors="*{email}"></div>
    </div>

    <div class="form-group">
      <label for="password">Senha (mínimo 8 caracteres)</label>
      <input id="password" type="password" th:field="*{password}"
             th:classappend="${#fields.hasErrors('password')} ? 'error'" placeholder="••••••••"/>
      <div th:if="${#fields.hasErrors('password')}" class="error-msg" th:errors="*{password}"></div>
    </div>

    <div class="form-group">
      <label for="role">Tipo de conta</label>
      <select id="role" th:field="*{role}" th:classappend="${#fields.hasErrors('role')} ? 'error'">
        <option value="">Selecione...</option>
        <option value="ROLE_VETERINARIAN">🩺 Veterinário</option>
        <option value="ROLE_TUTOR">👤 Tutor (dono do pet)</option>
      </select>
      <div th:if="${#fields.hasErrors('role')}" class="error-msg" th:errors="*{role}"></div>
    </div>

    <button type="submit" class="btn-submit">Criar conta</button>
  </form>

  <div class="divider">— ou —</div>
  <a href="/oauth2/authorization/google" style="display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:10px;color:#f1f5f9;text-decoration:none;font-size:14px;font-weight:500;transition:all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.12)'" onmouseout="this.style.background='rgba(255,255,255,0.07)'">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 002.38-5.88c0-.57-.05-.66-.15-1.18z"/><path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 01-7.18-2.54H1.83v2.07A8 8 0 008.98 17z"/><path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 010-3.04V5.41H1.83a8 8 0 000 7.18l2.67-2.07z"/><path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 001.83 5.4L4.5 7.49a4.77 4.77 0 014.48-3.3z"/></svg>
    Registrar com Google
  </a>
  <a href="/login" class="link-secondary">Já tem conta? Fazer login</a>
</div>
</body>
</html>
