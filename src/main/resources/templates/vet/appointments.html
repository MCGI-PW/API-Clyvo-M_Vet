<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/base :: head(title='Consultas — ClyvoVet')}"></head>
<body>
<div class="layout">
  <div th:replace="~{layouts/base :: sidebar}"></div>
  <div class="main-content">
    <div class="topbar">
      <h1 class="page-title">Minhas Consultas</h1>
      <div class="topbar-actions">
        <span style="font-size:13px;color:#64748b;" th:text="${appointments != null ? #lists.size(appointments) + ' consultas' : '0 consultas'}">0 consultas</span>
      </div>
    </div>
    <div class="page-content">

      <div th:if="${param.confirmed}" class="alert alert-success">Consulta confirmada!</div>
      <div th:if="${param.completed}" class="alert alert-success">Consulta concluida com sucesso!</div>

      <div class="card">
        <div class="card-body" style="padding:0;">
          <div class="table-container">
            <table class="table">
              <thead>
                <tr>
                  <th>Pet</th>
                  <th>Tutor</th>
                  <th>Data / Hora</th>
                  <th>Status</th>
                  <th>Acoes</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="apt : ${appointments}">
                  <td style="font-weight:600;" th:text="${apt.petName}">Pet</td>
                  <td style="color:#64748b;" th:text="${apt.tutorName}">Tutor</td>
                  <td style="font-size:13px;" th:text="${#temporals.format(apt.scheduledAt,'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                  <td>
                    <span th:if="${apt.status == 'Agendado'}" class="badge badge-blue" th:text="${apt.status}"></span>
                    <span th:if="${apt.status == 'Confirmado'}" class="badge badge-green" th:text="${apt.status}"></span>
                    <span th:if="${apt.status == 'Em Andamento'}" class="badge badge-amber" th:text="${apt.status}"></span>
                    <span th:if="${apt.status == 'Concluido'}" class="badge badge-gray" th:text="${apt.status}"></span>
                    <span th:if="${apt.status == 'Cancelado'}" class="badge badge-red" th:text="${apt.status}"></span>
                  </td>
                  <td>
                    <div style="display:flex;gap:6px;">
                      <form th:if="${apt.status == 'Agendado'}"
                            th:action="@{/vet/appointments/{id}/confirm(id=${apt.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-success btn-sm">Confirmar</button>
                      </form>
                      <form th:if="${apt.status == 'Confirmado' or apt.status == 'Em Andamento'}"
                            th:action="@{/vet/appointments/{id}/complete(id=${apt.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="finalNotes" value="Consulta concluida"/>
                        <button type="submit" class="btn btn-primary btn-sm">Concluir</button>
                      </form>
                    </div>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(appointments)}">
                  <td colspan="5" style="text-align:center;color:#94a3b8;padding:48px;">Nenhuma consulta encontrada.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
