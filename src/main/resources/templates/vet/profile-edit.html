<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/base :: head(title='Editar Perfil — ClyvoVet')}"></head>
<body>
<div class="layout">
  <div th:replace="~{layouts/base :: sidebar}"></div>
  <div class="main-content">
    <div class="topbar">
      <h1 class="page-title">Editar Perfil</h1>
      <div class="topbar-actions">
        <a th:href="@{/vet/profile}" class="btn btn-secondary">Cancelar</a>
      </div>
    </div>
    <div class="page-content">
      <div class="card" style="max-width:700px;">
        <div class="card-header"><span class="card-title">Informações Profissionais</span></div>
        <div class="card-body">
          <form th:action="@{/vet/profile/edit}" th:object="${updateRequest}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
              <label class="form-label">Especialidade</label>
              <select class="form-control" th:field="*{specialty}">
                <option value="">Selecione...</option>
                <option th:each="spec : ${T(com.clyvo.veterinary.veterinarian.domain.model.Specialty).values()}"
                        th:value="${spec.name()}"
                        th:text="${spec.getDisplayName()}"
                        th:selected="${spec == updateRequest.specialty}">
                </option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Telefone</label>
              <input type="text" class="form-control" th:field="*{phone}"
                     th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                     placeholder="(11) 99999-9999"/>
              <div th:if="${#fields.hasErrors('phone')}" class="invalid-feedback" th:errors="*{phone}"></div>
            </div>

            <div class="form-group">
              <label class="form-label">Biografia</label>
              <textarea class="form-control" th:field="*{bio}" rows="5"
                        th:classappend="${#fields.hasErrors('bio')} ? 'is-invalid'"
                        placeholder="Fale sobre sua experiência e área de atuação..."></textarea>
              <div th:if="${#fields.hasErrors('bio')}" class="invalid-feedback" th:errors="*{bio}"></div>
            </div>

            <div class="form-group">
              <label class="form-label">URL da Foto de Perfil</label>
              <input type="url" class="form-control" th:field="*{profilePictureUrl}" placeholder="https://..."/>
            </div>

            <div style="display:flex;gap:12px;margin-top:8px;">
              <button type="submit" class="btn btn-primary">Salvar Alterações</button>
              <a th:href="@{/vet/profile}" class="btn btn-secondary">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
