<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!--
  Template: error/404.html
  Descrição: Página de recurso não encontrado (HTTP 404 Not Found).
-->
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Página Não Encontrada — ClyvoVet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f1b2d 0%, #1e293b 50%, #0f172a 100%);
      color: #f1f5f9;
    }
    .error-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 60px 48px;
      text-align: center;
      max-width: 480px;
      width: 90%;
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .paw-animation {
      font-size: 60px;
      display: block;
      margin-bottom: 20px;
      animation: bounce 1.5s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }
    .error-code {
      font-size: 80px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .error-title { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
    .error-desc  { font-size: 15px; color: #94a3b8; line-height: 1.7; margin-bottom: 32px; }
    .btn-back {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white; text-decoration: none;
      border-radius: 10px; font-size: 14px; font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-back:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(37,99,235,0.4); }
  </style>
</head>
<body>
  <div class="error-card">
    <span class="paw-animation">🐾</span>
    <div class="error-code">404</div>
    <h1 class="error-title">Página Não Encontrada</h1>
    <p class="error-desc">
      O recurso que você está procurando fugiu como um gato!<br/>
      Verifique o endereço ou volte à página inicial.
    </p>
    <a th:href="@{/}" class="btn-back">🏠 Voltar ao Início</a>
  </div>
</body>
</html>
