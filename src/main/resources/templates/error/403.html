<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!--
  Template: error/403.html
  Descrição: Página de acesso negado (HTTP 403 Forbidden).
  Exibida quando um usuário tenta acessar um recurso sem a permissão necessária.
-->
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Acesso Negado — ClyvoVet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f1b2d 0%, #1e293b 50%, #0f172a 100%);
      color: #f1f5f9;
    }
    .error-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 60px 48px;
      text-align: center;
      max-width: 480px;
      width: 90%;
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .error-code {
      font-size: 80px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #ef4444, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .error-emoji { font-size: 52px; display: block; margin-bottom: 20px; }
    .error-title { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
    .error-desc { font-size: 15px; color: #94a3b8; line-height: 1.7; margin-bottom: 32px; }
    .btn-back {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white; text-decoration: none;
      border-radius: 10px; font-size: 14px; font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-back:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(37,99,235,0.4); }
    .btn-logout {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: #94a3b8; text-decoration: none;
      border-radius: 10px; font-size: 14px; font-weight: 600;
      margin-left: 12px; cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .btn-logout:hover { background: rgba(255,255,255,0.08); color: #f1f5f9; }
  </style>
</head>
<body>
  <div class="error-card">
    <span class="error-emoji">🚫</span>
    <div class="error-code">403</div>
    <h1 class="error-title">Acesso Negado</h1>
    <p class="error-desc">
      Você não tem permissão para acessar esta página.<br/>
      Verifique se você está logado com o perfil correto.
    </p>
    <div>
      <a th:href="@{/}" class="btn-back">🏠 Voltar ao Início</a>
      <form th:action="@{/logout}" method="post" style="display: inline;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="btn-logout">↩️ Trocar Conta</button>
      </form>
    </div>
  </div>
</body>
</html>
