# ==========================================
# AZURE PROFILE (App Service + Azure SQL Database / SQL Server)
# Ativação no App Service:  SPRING_PROFILES_ACTIVE=azure
# Os perfis "local" (H2) e "prod" (Oracle FIAP) continuam inalterados.
#
# Credenciais por variável de ambiente (nunca fixas no código). Qualquer um dos pares funciona:
#   SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
#       (gravados pelo script criar-banco-azure-sql.sh; têm prioridade sobre este arquivo)
#   DB_URL / DB_USER / DB_PASS   (mesmo padrão do perfil prod)
# ==========================================

# ------------------------------------------
# DATASOURCE: AZURE SQL DATABASE
# ------------------------------------------
spring.datasource.url=${DB_URL:jdbc:sqlserver://sql-server-aurora-565708-brazilsouth.database.windows.net:1433;database=db-aurora;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Pool pequeno: o plano Basic (5 DTU) aceita poucas requisições simultâneas (~30 workers)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
# Recicla conexões antes do gateway do Azure SQL derrubar as ociosas (~30 min)
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=240000

# ------------------------------------------
# JPA / HIBERNATE (dialeto SQL Server)
# ------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
# As migrations T-SQL usam NVARCHAR (acentos, emojis e símbolos do resumo da IA);
# assim o Hibernate também trata as Strings como NVARCHAR e o "validate" bate com o schema.
spring.jpa.properties.hibernate.use_nationalized_character_data=true
# O schema é criado pelo Flyway; o Hibernate só confere. Em último caso, JPA_DDL_AUTO=none.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false

# ------------------------------------------
# FLYWAY: migrations convertidas para T-SQL
# ------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration-sqlserver
spring.flyway.baseline-on-migrate=true
# Garante que V1..V8 rodem mesmo se o banco já tiver outros objetos
spring.flyway.baseline-version=0

# ------------------------------------------
# APLICAÇÃO EM PRODUÇÃO (mesmas regras do perfil prod)
# ------------------------------------------
jwt.secret=${JWT_SECRET}
# Usado só se o perfil "demo" também estiver ativo (SPRING_PROFILES_ACTIVE=azure,demo)
app.demo.password=${DEMO_PASSWORD:senha123}
app.oauth2.mock-enabled=false

server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.h2.console.enabled=false
spring.thymeleaf.cache=true
