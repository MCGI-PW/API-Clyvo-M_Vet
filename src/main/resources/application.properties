spring.application.name=api-clyvovet_M

# ==========================================
# ORACLE DATABASE CONFIGURATION (FIAP)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false

# ==========================================
# FLYWAY CONFIGURATION (ORACLE / H2)
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==========================================
# THYMELEAF CONFIGURATION
# ==========================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ==========================================
# JWT & APP CONFIGURATION
# ==========================================
# Obrigatório via variável de ambiente (sem valor padrão no código)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ==========================================
# OAUTH2 CLIENT CONFIGURATION (GOOGLE / GITHUB)
# ==========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-client-id-demo}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google-client-secret-demo}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:github-client-id-demo}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:github-client-secret-demo}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

