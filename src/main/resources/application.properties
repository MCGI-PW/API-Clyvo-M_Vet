spring.application.name=api-clyvovet_M

# ==========================================
# ORACLE DATABASE CONFIGURATION (FIAP)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false

# ==========================================
# FLYWAY CONFIGURATION (ORACLE / H2)
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==========================================
# THYMELEAF CONFIGURATION
# ==========================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ==========================================
# JWT & APP CONFIGURATION
# ==========================================
jwt.secret=${JWT_SECRET:clyvovet-super-secret-key-2026-must-be-at-least-256-bits-long-for-hs256}
jwt.expiration=86400000
