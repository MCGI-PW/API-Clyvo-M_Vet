# =============================================================
#  api-clyvovet_M — Configurações da Aplicação
# =============================================================

# --- Servidor ---
server.port=${PORT:8080}
server.servlet.context-path=/

# =============================================================
# BANCO DE DADOS — PostgreSQL
# =============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clyvovet_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexões HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# =============================================================
# JPA / HIBERNATE
# =============================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# ddl-auto=none porque o Flyway gerencia o schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =============================================================
# FLYWAY — Controle de versão do banco
# =============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =============================================================
# JWT — Autenticação stateless (para o APP mobile / REST)
# =============================================================
# ATENÇÃO: Em produção, use uma variável de ambiente para o secret!
jwt.secret=${JWT_SECRET:clyvovet-super-secret-key-2026-must-be-at-least-256-bits-long-for-hs256}
# Expiração em milissegundos: 24 horas
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# =============================================================
# OAUTH2 — Login com Google
# =============================================================
# ATENÇÃO: Valores configurados para o Google Cloud Console
# https://console.cloud.google.com/apis/credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:seu-id.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:GOCSPX-SuaChaveSecretaAqui}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# =============================================================
# SWAGGER / OPENAPI
# =============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# =============================================================
# INTEGRAÇÃO — Orquestrador .NET
# =============================================================
orchestrator.base-url=${ORCHESTRATOR_URL:http://localhost:5000}
orchestrator.api-key=${ORCHESTRATOR_API_KEY:dev-api-key}

# =============================================================
# LOGGING
# =============================================================
logging.level.com.clyvo.veterinary=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.flywaydb=INFO
