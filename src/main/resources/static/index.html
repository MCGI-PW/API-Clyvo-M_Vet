<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clyvo Vet — Plataforma de Saúde Veterinária</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="justify-content: center; align-items: center; text-align: center;">
    <main class="container" style="max-width: 540px; padding: 48px 36px;">
        <div style="display: flex; justify-content: flex-end; margin-bottom: 12px;">
            <button type="button" class="theme-toggle" onclick="toggleTheme()" aria-label="Alternar Tema">🌙</button>
        </div>

        <div class="brand-icon" style="margin: 0 auto 20px auto; width: 64px; height: 64px; font-size: 32px; border-radius: 18px;">
            🐾
        </div>

        <h1 style="font-size: 28px; margin-bottom: 8px;">Bem-vindo ao <span style="background: var(--aurora-gradient); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: aurora-flow 8s ease infinite;">Clyvo Vet</span></h1>
        
        <p style="font-size: 15px; margin-bottom: 28px; color: var(--text-secondary);">
            Gestão integrada e segura de consultas, equipes clínicas e prontuários veterinários com governança de dados e consentimento do tutor.
        </p>

        <a href="login.html" style="text-decoration: none; display: block;">
            <button type="button" class="btn-aurora" style="font-size: 16px; padding: 14px 24px;">
                Acessar Plataforma ✨
            </button>
        </a>

        <div style="margin-top: 24px; font-size: 12px; color: var(--text-muted);">
            Suporte a Tutores, Médicos Veterinários e Clínicas Integradas.
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
