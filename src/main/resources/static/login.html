<!DOCTYPE html>
<html>
<head>
    <title>Login - Clyvo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Login</h1>
    <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required><br><br>
        <input type="password" id="password" placeholder="Senha" required><br><br>
        <button type="submit">Entrar</button>
    </form>
    
    <hr>
    <h2>Cadastro</h2>
    <form id="registerForm">
        <select id="role">
            <option value="ROLE_TUTOR">Tutor</option>
            <option value="ROLE_VETERINARIAN">Veterinario</option>
        </select><br><br>
        <input type="text" id="regName" placeholder="Nome Completo" required><br><br>
        <input type="email" id="regEmail" placeholder="Email" required><br><br>
        <input type="password" id="regPassword" placeholder="Senha" required><br><br>
        <input type="number" id="regAge" placeholder="Idade" required><br><br>
        <input type="text" id="regPhone" placeholder="Telefone" required><br><br>
        <input type="text" id="regCrmv" placeholder="CRMV (Apenas Vet)"><br><br>
        <button type="submit">Cadastrar</button>
    </form>
    <script src="app.js"></script>
</body>
</html>
